services:
  - type: web
    name: flash-bingo
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/flash-bingo-mini-app run build && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/db run push
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
    healthCheckPath: /api/healthz
